# Railway deployment configuration for Vidya API
# Root Directory in Railway dashboard: / (blank / repo root)
# Uses Dockerfile.api for monorepo-aware builds

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.api"

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
